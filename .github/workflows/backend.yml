name: Docker Image CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: richardmogou/aqarfloaw

jobs:
  test:
    name: Test & Build Image
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: aqarflow
          POSTGRES_PASSWORD: aqarflow
          POSTGRES_DB: aqarflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U aqarflow"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://aqarflow:aqarflow@localhost:5432/aqarflow
      TEST_DATABASE_URL: postgresql+psycopg://aqarflow:aqarflow@localhost:5432/aqarflow
      SECRET_KEY: ci-secret-key

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Check migrations (upgrade, downgrade, upgrade)
        working-directory: backend
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: pytest

      - name: Build the Docker image
        run: docker build ./backend --file backend/Dockerfile --tag aqarflow-backend:$(date +%s)

  build-and-push:
    name: Docker Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
